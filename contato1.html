<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contato - Don Combat</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #000;
      color: #fff;
      line-height: 1.6;
    }

    header, footer {
      background-color: #ffcc00;
      color: #000;
      text-align: center;
      padding: 1rem;
    }

    .container {
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    h1 {
      color: #ffcc00;
      text-align: center;
      margin-bottom: 1rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    input, textarea {
      padding: 0.75rem;
      border: none;
      border-radius: 5px;
      font-size: 1rem;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn {
      background-color: #ffcc00;
      color: #000;
      padding: 0.75rem;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #e6b800;
    }
  </style>
</head>
<body>
  <header>
    <h1>Fale Conosco</h1>
  </header>

  <main class="container">
    <form action="mailto:contato@doncombat.com" method="POST" enctype="text/plain">
      <input type="text" name="nome" placeholder="Seu nome" required />
      <input type="email" name="email" placeholder="Seu e-mail" required />
      <textarea name="mensagem" placeholder="Sua mensagem" required></textarea>
      <button type="submit" class="btn">Enviar</button>
    </form>
  </main>

  <footer>
    <p>Contato: <a href="mailto:contato@doncombat.com">contato@doncombat.com</a></p>
    <p>&copy; 2025 Don Combat. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
