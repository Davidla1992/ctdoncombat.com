<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja Don Combat</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f4f4;
    }

    header {
      background-color: #111;
      color: #fff;
      padding: 1rem;
      text-align: center;
    }

    nav ul.menu {
      list-style: none;
      padding: 0;
      display: flex;
      justify-content: center;
      gap: 2rem;
    }

    nav ul.menu li a {
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    main {
      padding: 2rem;
    }

    .produtos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
    }

    .produto {
      background-color: #fff;
      padding: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-align: center;
    }

    .produto img {
      max-width: 100%;
      height: auto;
      border-radius: 4px;
    }

    .produto h3 {
      margin: 0.5rem 0;
    }

    .produto p {
      font-weight: bold;
      color: #333;
    }

    .produto button {
      background-color: #d32f2f;
      color: #fff;
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-radius: 4px;
    }

    .produto button:hover {
      background-color: #b71c1c;
    }

    footer {
      background-color: #111;
      color: #fff;
      text-align: center;
      padding: 1rem;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Loja Don Combat</h1>
    <nav aria-label="Menu principal">
      <ul class="menu">
        <li><a href="index.html">Início</a></li>
        <li><a href="modalidades.html">Modalidades</a></li>
        <li><a href="loja.html">Loja</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Produtos Oficiais da Academia</h2>
    <section class="produtos">
      <div class="produto">
        <img src="camiseta-doncombat.jpeg" alt="Camiseta Don Combat" />
        <h3>Camiseta Oficial</h3>
        <p>R$ 59,90</p>
        <button onclick="adicionarAoCarrinho('Camiseta Oficial')">Adicionar ao carrinho</button>
      </div>

      <div class="produto">
        <img src="luvas-doncombat.jpeg" alt="Luvas Don Combat" />
        <h3>Luvas de Treinamento</h3>
        <p>R$ 129,90</p>
        <button onclick="adicionarAoCarrinho('Luvas de Treinamento')">Adicionar ao carrinho</button>
      </div>

      <div class="produto">
        <img src="mochila-doncombat.jpeg" alt="Mochila Don Combat" />
        <h3>Mochila Esportiva</h3>
        <p>R$ 89,90</p>
        <button onclick="adicionarAoCarrinho('Mochila Esportiva')">Adicionar ao carrinho</button>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Don Combat. Todos os direitos reservados.</p>
  </footer>

  <script>
    const carrinho = [];

    function adicionarAoCarrinho(produto) {
      carrinho.push(produto);
      alert(`${produto} foi adicionado ao carrinho!`);
      console.log("Carrinho:", carrinho);
    }
  </script>
</body>
</html>
