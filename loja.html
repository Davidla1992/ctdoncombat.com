<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja Don Combat</title>
  <style>
    html {
      scroll-behavior: smooth;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #000;
      color: #fff;
      line-height: 1.6;
    }

    header, footer {
      background-color: #ffcc00;
      color: #000;
      text-align: center;
      padding: 1rem;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin: 1rem 0;
      padding: 0;
    }

    nav ul li a {
      color: #000;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav ul li a:hover {
      color: #fff;
    }

    .banner-container {
      width: 100%;
      max-height: 250px; /* altura reduzida */
      overflow: hidden;
    }

    .banner-container img {
      width: 100%;
      height: auto;
      object-fit: cover;
      display: block;
    }

    main {
      padding: 2rem;
      text-align: center;
    }

    .catalogo {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2rem;
      margin-top: 2rem;
    }

    .produto {
      background-color: #111;
      padding: 1rem;
      width: 280px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(255, 255, 0, 0.2);
      transition: transform 0.3s;
    }

    .produto:hover {
      transform: scale(1.03);
    }

    .produto img {
      max-width: 100%;
      border-radius: 4px;
      border: 2px solid #ffcc00;
    }

    .produto h3 {
      margin: 0.5rem 0;
      color: #ffcc00;
    }

    .produto p {
      font-weight: bold;
      color: #fff;
    }

    .produto button {
      background-color: #ffcc00;
      color: #000;
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      margin-top: 0.5rem;
      transition: background-color 0.3s;
    }

    .produto button:hover {
      background-color: #e6b800;
    }

    .inicio-button {
      display: block;
      margin: 2rem auto;
      background-color: #ffcc00;
      color: #000;
      padding: 0.75rem 1.5rem;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      width: fit-content;
      transition: background-color 0.3s;
    }

    .inicio-button:hover {
      background-color: #e6b800;
    }

    footer a {
      color: #000;
      font-weight: bold;
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      nav ul {
        flex-direction: column;
        align-items: center;
      }

      .produto {
        width: 90%;
      }

      .banner-container {
        max-height: 180px; /* ainda menor em telas pequenas */
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Loja Don Combat</h1>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="modalidades.html">Modalidades</a></li>
        <li><a href="loja.html" aria-current="page">Loja</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </nav>
  </header>

  <div class="banner-container">
    <img src="fotostore.jpg" alt="Banner da loja Don Combat" loading="lazy" />
  </div>

  <main>
    <section class="catalogo">
      <div class="produto">
        <img src="luva-muaythai.jpg" alt="Luva de Muay Thai" />
        <h3>Luva de Muay Thai</h3>
        <p>R$ 199,90</p>
        <button>Comprar</button>
      </div>

      <div class="produto">
        <img src="camiseta-doncombat.jpg" alt="Camiseta Don Combat" />
        <h3>Camiseta Don Combat</h3>
        <p>R$ 89,90</p>
        <button>Comprar</button>
      </div>

      <div class="produto">
        <img src="blusacombat.jpg" alt="Blusa Don Combat" />
        <h3>Blusa Don Combat</h3>
        <p>R$ 149,90</p>
        <button>Comprar</button>
      </div>
    </section>

    <a href="index.html" class="inicio-button">Voltar para o Início</a>
  </main>

  <footer id="contato">
    <p>Contato: <a href="mailto:contato@doncombat.com">contato@doncombat.com</a></p>
    <p>&copy; 2025 Don Combat. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
