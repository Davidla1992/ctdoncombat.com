<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loja Don Combat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #000;
      color: #fff;
      line-height: 1.6;
    }

    header, footer {
      background-color: #ffcc00;
      color: #000;
      text-align: center;
      padding: 1rem;
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin: 1rem 0;
      padding: 0;
    }

    nav ul li a {
      color: #000;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav ul li a:hover {
      color: #fff;
    }

    .banner-container {
      position: relative;
      width: 100%;
      max-height: 400px;
      overflow: hidden;
    }

    .banner-container img {
      width: 100%;
      height: auto;
      object-fit: cover;
      display: block;
    }

    .banner-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background-color: rgba(0, 0, 0, 0.6);
      color: #ffcc00;
      padding: 1rem 2rem;
      border-radius: 8px;
      font-size: 1.8rem;
      font-weight: bold;
      text-align: center;
    }

    main {
      padding: 2rem;
      text-align: center;
    }

    .produto {
      background-color: #111;
      padding: 1rem;
      margin: 1rem auto;
      max-width: 300px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(255, 255, 0, 0.2);
    }

    .produto img {
      max-width: 100%;
      border-radius: 4px;
      border: 2px solid #ffcc00;
    }

    .produto h3 {
      margin: 0.5rem 0;
      color: #ffcc00;
    }

    .produto p {
      font-weight: bold;
      color: #fff;
    }

    .produto button {
      background-color: #ffcc00;
      color: #000;
      border: none;
      padding: 0.5rem 1rem;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    .produto button:hover {
      background-color: #e6b800;
    }

    .inicio-button {
      display: block;
      margin: 2rem auto;
      background-color: #ffcc00;
      color: #000;
      padding: 0.75rem 1.5rem;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      width: fit-content;
      transition: background-color 0.3s;
    }

    .inicio-button:hover {
      background-color: #e6b800;
    }

    footer a {
      color: #000;
      font-weight: bold;
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      nav ul {
        flex-direction: column;
        align-items: center;
      }

      .produto {
        max-width: 90%;
      }

      .banner-text {
        font-size: 1.2rem;
        padding: 0.5rem 1rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Loja Don Combat</h1>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="modalidades.html">Modalidades</a></li>
        <li><a href="loja.html">Loja</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </nav>
  </header>

  <!-- Banner com imagem e texto sobreposto -->
  <div class="banner-container">
    <img src="store.jpg" alt="Imagem da loja Don Combat" loading="lazy" />
    <div class="banner-text">Equipamentos e estilo para guerreiros</div>
  </div>

  <main>
    <div class="produto">
      <img src="luva-muaythai.jpg" alt="Luva de Muay Thai" />
      <h3>Luva de Muay Thai</h3>
      <p>R$ 199,90</p>
      <button>Comprar</button>
    </div>

    <div class="produto">
      <img src="camiseta-doncombat.jpg" alt="Camiseta Don Combat" />
      <h3>Camiseta Don Combat</h3>
      <p>R$ 89,90</p>
      <button>Comprar</button>
    </div>

    <a href="index.html" class="inicio-button">Voltar para o Início</a>
  </main>

  <footer id="contato">
    <p>Contato: <a href="mailto:contato@doncombat.com">contato@doncombat.com</a></p>
    <p>&copy; 2025 Don Combat. Todos os direitos reservados.</p>
  </footer>
</body>
</html>
