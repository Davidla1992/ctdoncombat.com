<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modalidades - Don Combat</title>
  <style>
    html {
      scroll-behavior: smooth;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #000;
      color: #fff;
      line-height: 1.6;
    }

    header, footer {
      background-color: #ffcc00;
      color: #000;
      text-align: center;
      padding: 1rem;
    }

    .logo h1 {
      font-size: 1.8rem;
    }

    nav ul.menu {
      list-style: none;
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 1rem;
      padding: 0;
    }

    nav ul.menu li a {
      color: #000;
      text-decoration: none;
      font-weight: bold;
      transition: color 0.3s;
    }

    nav ul.menu li a:hover,
    nav ul.menu li a[aria-current="page"] {
      color: #fff;
    }

    .banner-container {
      width: 100%;
      overflow: hidden;
    }

    .banner-img {
      width: 100%;
      max-height: 300px; /* 10x maior que antes */
      object-fit: cover;
      display: block;
    }

    .catalogo {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.5rem;
      margin: 2rem;
    }

    .modalidade {
      background-color: #111;
      padding: 1rem;
      width: 280px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(255, 255, 0, 0.2);
      text-align: center;
      text-decoration: none;
      transition: transform 0.3s;
    }

    .modalidade:hover {
      transform: scale(1.03);
    }

    .modalidade img {
      max-width: 100%;
      border-radius: 4px;
      border: 2px solid #ffcc00;
    }

    .modalidade h3 {
      margin: 0.5rem 0;
      color: #ffcc00;
    }

    .inicio-button {
      display: block;
      margin: 2rem auto;
      background-color: #ffcc00;
      color: #000;
      padding: 0.75rem 1.5rem;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      width: fit-content;
      transition: background-color 0.3s;
    }

    .inicio-button:hover {
      background-color: #e6b800;
    }

    footer a {
      color: #000;
      font-weight: bold;
      text-decoration: underline;
    }

    @media (max-width: 768px) {
      nav ul.menu {
        flex-direction: column;
        align-items: center;
      }

      .modalidade {
        width: 90%;
      }

      .banner-img {
        max-height: 200px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <h1>Centro de Treinamento Don Combat</h1>
    </div>
    <nav aria-label="Menu principal">
      <ul class="menu">
        <li><a href="index.html">Início</a></li>
        <li><a href="modalidades.html" aria-current="page">Modalidades</a></li>
        <li><a href="loja.html">Loja</a></li>
        <li><a href="horarios.html">Horários</a></li>
        <li><a href="localizacao.html">Localização</a></li>
        <li><a href="contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="banner-container">
